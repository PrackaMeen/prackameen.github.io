<main class="page-shell">
  <section class="card">
    <p class="kicker">Multiplayer / Network</p>
    <h1>Host via Network</h1>
    <p id="hostStatus" class="status-text">Create a room to open the connected users list and QR code.</p>
    <button id="startBtn" class="primary-btn" type="button">Create Room</button>
  </section>

  <section class="card" id="peersCard" hidden>
    <h2>Connected Users <span id="peerCount" class="peer-count">(0)</span></h2>
    <ul id="peerList" class="peer-list" aria-label="Connected users">
      <li class="peer-item peer-item--empty">Waiting for players…</li>
    </ul>
  </section>

  <section class="card" id="qrCodeCard" hidden>
    <h2>QR Code</h2>
    <div id="qrCodeContainer" class="qr-code-container"></div>
  </section>
</main>
