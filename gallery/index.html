<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Projects by PrackaMeen: games, tools and experiments." />
  <meta name="theme-color" content="#0b1220" />
  <link rel="icon" href="data:," />
  <title>PrackaMeen Projects</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --surface: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --border: #dbe2ec;
      --accent: #2563eb;
      --accent-text: #ffffff;
      --shadow: 0 1px 2px rgba(15, 23, 42, 0.06), 0 6px 18px rgba(15, 23, 42, 0.06);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0b1220;
        --surface: #121c2e;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --border: #22304a;
        --accent: #60a5fa;
        --accent-text: #0b1220;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 6px 18px rgba(0, 0, 0, 0.35);
      }
    }

    :root[data-theme="dark"] {
      --bg: #0b1220;
      --surface: #121c2e;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --border: #22304a;
      --accent: #60a5fa;
      --accent-text: #0b1220;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 6px 18px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
      min-height: 100vh;
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 48px 16px 64px;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: clamp(1.75rem, 4vw, 2.5rem);
      letter-spacing: -0.02em;
    }

    header p {
      margin: 0;
      color: var(--muted);
      max-width: 60ch;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
      margin-top: 32px;
      padding: 0;
      list-style: none;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0;
    }

    .card h2 {
      margin: 0;
      font-size: 1.2rem;
      overflow-wrap: anywhere;
    }

    .card p {
      margin: 0;
      color: var(--muted);
      flex: 1;
      overflow-wrap: anywhere;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .actions a {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--text);
      text-decoration: none;
      font-size: 0.95rem;
    }

    .actions a.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-text);
      font-weight: 600;
    }

    .actions a:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    .status {
      margin-top: 32px;
      color: var(--muted);
    }

    footer {
      margin-top: 48px;
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>PrackaMeen Projects</h1>
      <p>Games, tools and experiments. Pick a project to open it.</p>
    </header>

    <ul id="projects" class="grid" aria-live="polite"></ul>
    <p id="status" class="status">Loading projects…</p>

    <footer>
      Source for this site: <a href="https://github.com/PrackaMeen/prackameen.github.io">PrackaMeen/prackameen.github.io</a>
    </footer>
  </div>

  <script>
    (function () {
      var list = document.getElementById("projects");
      var status = document.getElementById("status");

      function fail(message) {
        status.textContent = message;
      }

      function createCard(project) {
        var item = document.createElement("li");
        item.className = "card";

        var title = document.createElement("h2");
        title.textContent = project.title;

        var description = document.createElement("p");
        description.textContent = project.description;

        var actions = document.createElement("div");
        actions.className = "actions";

        if (project.path) {
          var open = document.createElement("a");
          open.className = "primary";
          open.href = project.path;
          open.textContent = "Open";
          actions.appendChild(open);
        }

        if (project.repo) {
          var source = document.createElement("a");
          source.href = project.repo;
          source.rel = "noopener";
          source.textContent = "Source";
          actions.appendChild(source);
        }

        item.appendChild(title);
        item.appendChild(description);
        item.appendChild(actions);
        return item;
      }

      // Relative URL so the page works under any subpath (for example /prackameen.github.io/ on Pages).
      fetch("./projects.json", { cache: "no-cache" })
        .then(function (response) {
          if (!response.ok) {
            throw new Error("HTTP " + response.status);
          }
          return response.json();
        })
        .then(function (projects) {
          if (!Array.isArray(projects) || projects.length === 0) {
            fail("No projects listed yet.");
            return;
          }
          var fragment = document.createDocumentFragment();
          projects.forEach(function (project) {
            fragment.appendChild(createCard(project));
          });
          list.appendChild(fragment);
          status.remove();
        })
        .catch(function (error) {
          fail("Could not load the project list (" + error.message + ").");
        });
    })();
  </script>
</body>
</html>
