<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ff6f3c" />
  <meta name="description" content="G.A.M.E Mobile Test Lab - static PWA with GitHub-hosted API mocks." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon-192.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/icon-192.svg" />
  <title>G.A.M.E Mobile Test Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="bg-shape bg-shape-1" aria-hidden="true"></div>
  <div class="bg-shape bg-shape-2" aria-hidden="true"></div>

  <main class="app-shell">
    <header class="hero">
      <p class="eyebrow">Static PWA Playground</p>
      <h1>G.A.M.E Mobile Test Lab</h1>
      <p class="subtitle">
        Pure HTML, CSS and JavaScript. Future .NET API endpoints are auto-mocked when hosted on GitHub.
      </p>
      <div class="hero-row">
        <button id="refreshBtn" class="btn btn-primary" type="button">Refresh State</button>
        <button id="actionBtn" class="btn btn-ghost" type="button">Perform Sample Action</button>
      </div>
      <div class="status-row" id="statusRow">
        <span id="installState" class="pill">Install: unavailable</span>
        <span id="networkMode" class="pill">API: unknown</span>
      </div>
    </header>

    <section class="panel" aria-labelledby="stateTitle">
      <div class="panel-title-row">
        <h2 id="stateTitle">Game Snapshot</h2>
        <small id="lastUpdated">Waiting for data</small>
      </div>
      <div id="statsGrid" class="stats-grid" role="status" aria-live="polite"></div>
    </section>

    <section class="panel" aria-labelledby="logTitle">
      <div class="panel-title-row">
        <h2 id="logTitle">Event Feed</h2>
      </div>
      <ul id="eventFeed" class="event-feed" aria-live="polite"></ul>
    </section>
  </main>

  <template id="statCardTemplate">
    <article class="stat-card">
      <h3></h3>
      <p class="value"></p>
      <p class="caption"></p>
    </article>
  </template>

  <script src="./mock-api.js"></script>
  <script src="./app.js" type="module"></script>
</body>
</html>
